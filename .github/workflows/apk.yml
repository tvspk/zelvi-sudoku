# Při každém pushi do main: kontroly, webová verze aktuální, stavba APK. Když je v android/verze.txt nová verze,
# vznikne vydání v<verze> se souborem zelvi-sudoku.apk (instaluje se přes předchozí verzi, postup zůstane).
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Žádné klíče ani osobní údaje v repozitáři
        run: |
          if git ls-files | grep -Ei '\.jks$|heslo|keystore'; then echo "::error::Podpisový klíč nesmí být v repozitáři."; exit 1; fi
          if grep -rIl 'github_pat_[A-Za-z0-9]\{20\}' --exclude-dir=.git . ; then echo "::error::Token nesmí být v repozitáři."; exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Nástroje (npm)
        run: sh android/pripravit_nastroje.sh

      - name: Webová verze je aktuální
        run: python3 scripts/build_web.py --check

      - name: Stavba APK
        env:
          ZS_KEYSTORE: ${{ secrets.ZELVI_KEYSTORE }}
          ZS_KEYSTORE_PASSWORD: ${{ secrets.ZELVI_KEYSTORE_PASSWORD }}
        run: sh android/build.sh

      - name: APK jako artefakt běhu
        uses: actions/upload-artifact@v4
        with:
          name: zelvi-sudoku-apk
          path: android/out/zelvi-sudoku.apk
          retention-days: 14

      - name: Vydání (jen nová verze podepsaná klíčem)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat android/build/version)"
          if [ "$(cat android/build/release)" != "yes" ]; then echo "Bez klíče (Secrets) – nevydává se."; exit 0; fi
          if gh release view "v$V" >/dev/null 2>&1; then echo "Vydání v$V už existuje – pro nové zvyšte verzi v android/verze.txt."; exit 0; fi
          gh release create "v$V" android/out/zelvi-sudoku.apk --title "Želví sudoku $V" --latest \
            --notes "Želví sudoku $V pro Android. Nainstalujte zelvi-sudoku.apk přes předchozí verzi, postup zůstane."
